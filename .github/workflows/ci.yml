name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: touch .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Check coverage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov > /dev/null
          lcov --summary coverage/lcov.info
          lcov --remove coverage/lcov.info '*.g.dart' 'lib/generated/*' -o coverage/lcov_cleaned.info --ignore-errors unused
          genhtml coverage/lcov_cleaned.info -o coverage/html --quiet
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          lcov --summary coverage/lcov_cleaned.info 2>&1 | tail -3 >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/html/

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ..

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.2

      - name: Build
        run: npm run build

      - name: Test unit functions
        run: npm run test:unit

      - name: Test account deletion
        run: npm run test:account-deletion

      - name: Test Firestore security rules
        run: npm --prefix .. run test:rules

      - name: Test username claims
        run: npm --prefix .. run test:functions:usernames

      - name: Test social writes
        run: npm run test:social

      - name: Test chat cleanup
        run: npm --prefix .. run test:functions:chat

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

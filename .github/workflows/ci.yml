name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: touch .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Check coverage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov > /dev/null
          lcov --summary coverage/lcov.info
          lcov --remove coverage/lcov.info '*.g.dart' 'lib/generated/*' -o coverage/lcov_cleaned.info --ignore-errors unused
          genhtml coverage/lcov_cleaned.info -o coverage/html --quiet
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          lcov --summary coverage/lcov_cleaned.info 2>&1 | tail -3 >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/html/

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:artist-keys

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <script>
    // Enlaces compartidos: /invite (la app) y /u/<username> (un perfil).
    // La web continúa en la ruta del router (hash): /invite desde la raíz, que
    // es también el start_url de la PWA, y /u/ en la ruta del perfil.
    //
    // En Android la app instalada abre /u/ por App Links sin pasar por aquí,
    // pero el enlace también puede acabar en una pestaña o en un navegador
    // integrado. Como desde la página no se sabe si la app está instalada, se
    // le entrega el perfil con un intent: si existe lo abre y, si no, el
    // navegador continúa en Google Play.
    (function () {
      var path = window.location.pathname;
      var profile = /^\/u\/([A-Za-z0-9_]{3,20})\/?$/.exec(path);
      if (!profile && !/^\/invite\/?$/.test(path)) return;
      var username = profile ? profile[1].toLowerCase() : null;
      var webLocation = username ? '/#/u/' + username : '/';
      var userAgent = window.navigator.userAgent;
      var playUrl = 'https://play.google.com/store/apps/details?id=app.musilink';

      // Quien ya usa la web en este navegador (PWA abierta o sesión iniciada
      // alguna vez) se queda en ella. La clave es la de UserSetupCache.
      function usesWebApp() {
        if (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        ) {
          return true;
        }
        try {
          for (var i = 0; i < window.localStorage.length; i++) {
            var key = window.localStorage.key(i) || '';
            if (key.indexOf('flutter.user_setup_state_v2_') === 0) return true;
          }
        } catch (_) {
          // Sin acceso al almacenamiento se trata como un navegador nuevo.
        }
        return false;
      }

      if (!/Android/i.test(userAgent) || usesWebApp()) {
        window.history.replaceState(null, '', webLocation);
        return;
      }
      // Un WebView sin navegador no entiende los intents y mostraría un error.
      if (!username || /\bwv\b/.test(userAgent)) {
        window.location.replace(playUrl);
        return;
      }
      // Si el navegador ignora el intent, la web sigue cargando el perfil.
      window.history.replaceState(null, '', webLocation);
      window.location.href =
        'intent://musilink.app/u/' + username +
        '#Intent;scheme=https;package=app.musilink;S.browser_fallback_url=' +
        encodeURIComponent(playUrl) + ';end';
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta id="app-theme-color" name="theme-color" content="#121212">
  <meta id="app-color-scheme" name="color-scheme" content="dark">
  <meta name="description" content="Conecta con tus amigos a través de la música.">

  <!-- Vista previa del enlace en apps de mensajería y redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MusiLink">
  <meta property="og:title" content="MusiLink">
  <meta property="og:description" content="Conecta con tus amigos a través de la música.">
  <meta property="og:url" content="https://musilink.app/">
  <meta property="og:image" content="https://musilink.app/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="google-signin-client_id" content="701824546350-1tkqdr8bl7eosggab56c79u097ragkhn.apps.googleusercontent.com">
  <link rel="canonical" href="https://musilink.app/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta id="app-status-bar-style" name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MusiLink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MusiLink</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background-color: #121212;
      color-scheme: dark;
    }

    html[data-app-theme="light"],
    html[data-app-theme="light"] body {
      background-color: #ffffff;
      color-scheme: light;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background-color: #121212;
      opacity: 1;
      transition: opacity 180ms ease-out;
    }

    html[data-app-theme="light"] #app-loading {
      background-color: #ffffff;
    }

    #app-loading.app-loading--hidden {
      pointer-events: none;
      opacity: 0;
    }

    #app-loading img {
      width: min(190px, 56vw);
      height: auto;
    }

    .app-loading__spinner {
      width: 28px;
      height: 28px;
      box-sizing: border-box;
      border: 3px solid rgba(27, 191, 86, 0.22);
      border-top-color: #1bbf56;
      border-radius: 50%;
      animation: app-loading-spin 800ms linear infinite;
    }

    @keyframes app-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading {
        transition: none;
      }

      .app-loading__spinner {
        animation: none;
      }
    }
  </style>

  <script>
    (() => {
      let savedTheme = null;
      try {
        savedTheme = JSON.parse(
          window.localStorage.getItem('flutter.theme_mode'),
        );
      } catch (_) {
        // Fall back to the system appearance when storage is unavailable.
      }

      const systemIsDark = window.matchMedia(
        '(prefers-color-scheme: dark)',
      ).matches;
      const isDark =
        savedTheme === 'dark' || (savedTheme !== 'light' && systemIsDark);
      const color = isDark ? '#121212' : '#ffffff';

      document.documentElement.dataset.appTheme = isDark ? 'dark' : 'light';
      document
        .getElementById('app-theme-color')
        ?.setAttribute('content', color);
      document
        .getElementById('app-color-scheme')
        ?.setAttribute('content', isDark ? 'dark' : 'light');
      document
        .getElementById('app-status-bar-style')
        ?.setAttribute('content', isDark ? 'black-translucent' : 'default');
    })();
  </script>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Cargando MusiLink">
    <img src="assets/assets/images/logo.png" alt="MusiLink">
    <div class="app-loading__spinner" aria-hidden="true"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="pwa_viewport.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
